name = "goal-roi-continuity"
main = "watchdog.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

[vars]
RECOVERY_ENABLED = "false"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "GUARD"
class_name = "RecoveryGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecoveryGuard"]

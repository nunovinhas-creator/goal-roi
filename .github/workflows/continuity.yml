name: Restore collection chain
on:
  workflow_run:
    workflows: ['Collect ScanGoal']
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  restart:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: scangoal-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      # This job can replace a pending successor. Always refill its slot before releasing the lock.
      - run: timeout 85s python3 scripts/dispatch_collection.py
        env:
          GH_TOKEN: ${{ github.token }}

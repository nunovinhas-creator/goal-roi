name: Restore collection chain
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ['Collect ScanGoal']
    branches: [main]
    types: [completed]
permissions: {}
jobs:
  restart:
    permissions:
      contents: read
      actions: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: scangoal-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      # This job can replace a pending successor. Always refill its slot before releasing the lock.
      - run: timeout 85s python3 scripts/dispatch_collection.py
        env:
          GH_TOKEN: ${{ github.token }}

  observe:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
    concurrency:
      group: scangoal-continuity-observer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/observe_collection.py
          sparse-checkout-cone-mode: false
      - run: python3 -I scripts/observe_collection.py
        env:
          GH_TOKEN: ${{ github.token }}

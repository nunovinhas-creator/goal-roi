name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-verification.txt
      - run: node --test ops/continuity/watchdog.test.mjs
      - name: Install Chromium for the offline dashboard regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser-tests/node_modules" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v

name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Audited RSA verification for the BSD journal OIDC tests (no hand-written crypto).
      - run: pip install cryptography==44.0.3
      - run: python -m unittest discover -s tests -v

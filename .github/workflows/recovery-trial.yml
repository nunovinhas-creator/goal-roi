{
  "name": "Recovery trial — blocked preflight only",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "preflight": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Prepare isolated snapshot and report blocking conditions",
          "env": {
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "python -m scangoal.recovery_trial --output \"$RUNNER_TEMP/recovery-trial\""
        },
        {
          "name": "Preserve sanitized preflight report only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "recovery-preflight-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/recovery-trial/preflight.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}

# Diagnostic only. NEVER installs or activates the 30-day SHADOW collector.
# Separate jobs/runners validate transfer of SYNTHETIC, non-production evidence.
name: SHADOW isolated preflight
on:
  pull_request:
    paths:
      - '.github/workflows/shadow-preflight.yml'
      - 'scripts/shadow_preflight.py'
      - 'tests/test_shadow_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Offline capture feasibility and synthetic outbox
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Assert preflight invariants offline
        run: python -m unittest discover -s tests -p test_shadow_preflight.py -v
      - name: Measure lower bound of OPEN_GAME capture delay (no API calls)
        run: |
          python scripts/shadow_preflight.py measure \
            --path data/messages.jsonl --window-hours 24 \
            --output "$RUNNER_TEMP/shadow-delivery.json"
      - name: Prepare synthetic Git outbox, never production data
        run: |
          python scripts/shadow_preflight.py stage \
            --dir "$RUNNER_TEMP/synthetic-transfer"
      - name: Transfer synthetic evidence to independent runner
        uses: actions/upload-artifact@v4
        with:
          name: shadow-preflight-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/shadow-delivery.json
            ${{ runner.temp }}/synthetic-transfer/

  restore:
    name: Fresh runner verifies and restores synthetic outbox
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Receive one-day synthetic transfer
        uses: actions/download-artifact@v4
        with:
          name: shadow-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/received
      - name: Validate checksums, restore on new runner and prove no duplicates
        run: |
          python scripts/shadow_preflight.py restore \
            --dir "$RUNNER_TEMP/received/synthetic-transfer" \
            --output "$RUNNER_TEMP/restore-evidence.json"
      - name: Display read-only evidence summary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          delivery=json.loads((base/'received/shadow-delivery.json').read_text())
          proof=json.loads((base/'restore-evidence.json').read_text())
          assert delivery['activation_approved'] is False
          assert proof['activation_approved'] is False
          assert proof['outbox_restore']=='passed'
          print('COLLECTOR_FIRST_SIGHT_ONLY:',delivery['valid_first_observations'],
                'WITHIN_120:',delivery['first_observed_within_limit'],
                'LATE:',delivery['first_observed_over_limit'])
          print('CROSS_RUNNER_SYNTHETIC_RESTORED:',proof['outbox_restore'])
          print('NO_REAL_RUNNER_CAPTURE_OR_ACTIVATION:',delivery['conclusion'])
          PY

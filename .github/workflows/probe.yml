name: Probe ScanGoal match page (manual)
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do jogo (ex.: barnsley-vs-oldham-20261111)'
        default: 'barnsley-vs-oldham-20261111'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One request to one match page
        env:
          SLUG: ${{ inputs.slug }}
        run: python scripts/probe_match_page.py "$SLUG"

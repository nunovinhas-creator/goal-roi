name: Dropping Odds Handicap
on:
  workflow_run:
    workflows: ['Collect ScanGoal']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Create the Dropping Odds journal for the first shadow run'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scangoal-dropping-odds
  cancel-in-progress: false

jobs:
  dropping-odds:
    if: >-
      ${{ github.repository == 'nunovinhas-creator/goal-roi' &&
          github.ref == 'refs/heads/main' &&
          (vars.GOAL_ROI_DROPPING_ODDS == 'shadow' || vars.GOAL_ROI_DROPPING_ODDS == 'on') &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            /scangoal/
            /data/messages.jsonl
            /requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ vars.GOAL_ROI_DROPPING_ODDS == 'on' }}
        with:
          python-version: '3.11'
      - name: Install the existing Telegram transport dependencies
        if: ${{ vars.GOAL_ROI_DROPPING_ODDS == 'on' }}
        run: pip install -r requirements.txt
      - name: Evaluate the published ScanGoal archive
        env:
          GOAL_ROI_DROPPING_ODDS: ${{ vars.GOAL_ROI_DROPPING_ODDS }}
          GOAL_ROI_DROPPING_ODDS_MAX_AGE_MIN: ${{ vars.GOAL_ROI_DROPPING_ODDS_MAX_AGE_MIN }}
          GOAL_ROI_DROPPING_ODDS_ON_SINCE: ${{ vars.GOAL_ROI_DROPPING_ODDS_ON_SINCE }}
          TG_BOT_TOKEN: ${{ vars.GOAL_ROI_DROPPING_ODDS == 'on' && secrets.TG_BOT_TOKEN || '' }}
          TG_CHAT_ID: ${{ vars.GOAL_ROI_DROPPING_ODDS == 'on' && secrets.TG_CHAT_ID || '' }}
          INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize }}
        run: |
          command=run
          if [[ "$INITIALIZE" == true ]]; then command=initialize; fi
          timeout --signal=TERM --kill-after=3s 90s python3 -u -m scangoal.dropping_odds_alerts "$command"

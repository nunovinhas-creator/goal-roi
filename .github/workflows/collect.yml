name: Collect ScanGoal
on:
  workflow_dispatch:
    inputs:
      force_results:
        description: 'Consultar já as fontes de resultados (gasta quota)'
        type: boolean
        default: false
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'   # de 10 em 10 minutos (lista explícita)
permissions:
  contents: write
  actions: write
concurrency:
  group: scangoal-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read bot conversation (read-only)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_SCANGOAL: ${{ secrets.TG_SCANGOAL }}
        run: timeout --signal=TERM --kill-after=10s 220s python -u -m scangoal.reader
      - name: Results from Highlightly (every 90 minutes at most; skipped without key)
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          HL_MIN_INTERVAL_MIN: ${{ inputs.force_results && '0' || '90' }}
        run: python -u -m scangoal.results_hl
      - name: Goal minutes from Highlightly (every 2 hours at most, 5 matches per run)
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: python -u -m scangoal.details_hl
      - name: Results from BSD (hourly at most; skipped without key)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_MIN_INTERVAL_MIN: ${{ inputs.force_results && '0' || '50' }}
        run: python -u -m scangoal.results_bsd
      - name: Language model investigation (hourly, within the free daily budget; skipped without keys)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MASTER_BRAIN_LLM_API_KEY: ${{ secrets.MASTER_BRAIN_LLM_API_KEY }}
        run: python -u -m scangoal.llm
      - name: Report (fixed rules)
        run: python -m scangoal.report > /dev/null && cp data/report.json docs/report.json
      - name: Telegram notices through the user's bot (skipped without keys)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u -m scangoal.notify
      - name: Commit data
        run: |
          git add data docs/report.json docs/bets.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="scangoal-collector" -c user.email="actions@users.noreply.github.com" commit -q -m "data: collect [skip ci]"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
      - name: Tell the user when a collection fails (at most once an hour)
        if: ${{ failure() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u -m scangoal.notify --failure
      # Leitura rápida: no tempo em que a execução antes ficava parada (8 minutos), relê o bot de 2 em 2 minutos com uma só
      # ligação, refaz o relatório e envia os avisos quando há mensagens novas. Nunca falha a execução; sem leituras, só espera.
      - name: Fast reads every 2 minutes until the next collection (read-only)
        id: fast
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_SCANGOAL: ${{ secrets.TG_SCANGOAL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: timeout --signal=TERM --kill-after=10s 540s python -u -m scangoal.watch
      - name: Commit data from the fast reads
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        continue-on-error: true
        run: |
          git add data docs/report.json docs/bets.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="scangoal-collector" -c user.email="actions@users.noreply.github.com" commit -q -m "data: collect [skip ci]"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
      # O agendamento do GitHub não dispara neste repositório. Cada execução lança a seguinte (permitido ao GITHUB_TOKEN
      # para workflow_dispatch). O grupo de concorrência garante uma só cadeia: uma execução nova substitui a que estiver à espera.
      - name: Start the next collection
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.fast.outcome }}" = "skipped" ]; then sleep 480; fi
          gh workflow run collect.yml --repo "${GITHUB_REPOSITORY}" --ref main
